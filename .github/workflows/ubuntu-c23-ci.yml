name: Ubuntu-C23-CI

'on':
  - push
  - pull_request

permissions:
  contents: read

jobs:
  ci:
    name: ubuntu-c23-${{ matrix.compiler.cc }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        compiler:
          - { cc: gcc, cxx: g++ }
          - { cc: clang, cxx: clang++ }

    env:
      CC: ${{ matrix.compiler.cc }}
      CXX: ${{ matrix.compiler.cxx }}

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Configure build (C23 / C++23)
        run: |
          cmake \
            -S . \
            -B build \
            -DCMAKE_C_STANDARD=23 \
            -DCMAKE_CXX_STANDARD=23 \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/install" \
            -DENABLE_ROARING_TESTS=ON \
            -DROARING_UNSAFE_FROZEN_TESTS=ON

      - name: Build/test/install
        run: |
          cmake --build build
          ctest --test-dir build --output-on-failure
          cmake --install build

      - name: Build installation-find sample
        run: |
          cmake \
            -S tests/installation/find \
            -B tests/installation/find/build \
            -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/install"
          cmake --build tests/installation/find/build
